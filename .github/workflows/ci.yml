name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The JSON in public/r is what people install. Fail if it is out of date with the source.
      - run: pnpm registry:check
      - run: pnpm build
      # Install every item into a fresh Next.js app with the shadcn CLI, then typecheck and build that app.
      - run: pnpm smoke
